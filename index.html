<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chic Distribution">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Chic Distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --ink:#17140F; --muted:#8C857B; --line:#ECE7DF;
  --acc:#F28C28; --acc-d:#D9741A; --acc-s:#FDEEDC; --ok:#2F9E5B; --ok-s:#E3F4EA; --bad:#E0483A; --bad-s:#FCE6E3;
  --r-xl:28px; --r-l:22px; --r-m:16px; --sh:0 1px 2px rgba(23,20,15,.04),0 8px 24px rgba(23,20,15,.06);
  --t-surg:#E5F0FB; --t-frais:#E7F5E4; --t-epic:#FBF1DD; --t-sauc:#FCE4E1; --t-bois:#EAE6FB; --t-four:#F1ECE4; --t-entr:#E1F4F3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:700}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.hi small{display:block;color:var(--muted);font-size:13px;font-weight:500}.hi b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.icbtn{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);flex:none;font-size:18px;position:relative}
.icbtn svg{width:20px;height:20px}
.icbtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:2px solid #fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--sh);margin-bottom:18px}
.search .sic{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.search .sic svg{width:18px;height:18px}
.search input{border:0;outline:0;background:none;flex:1;font-size:16px;padding:8px 0;min-width:0}
.search .x{color:var(--muted);font-size:20px;padding:4px}
.chips{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:68px}
.chip .c{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--card);box-shadow:var(--sh);transition:.15s}
.chip span{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
.chip.on .c{background:var(--acc);box-shadow:0 6px 16px rgba(242,140,40,.35)}
.chip.on span{color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 12px}
.sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec a,.sec button{font-size:13px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.pc{background:var(--card);border-radius:var(--r-l);padding:10px 10px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;position:relative}
.pc .im{height:96px;border-radius:16px;display:grid;place-items:center;font-size:44px;position:relative}
.pc .im .hab{position:absolute;left:8px;top:8px;background:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:3px 8px;color:var(--acc-d)}
.pc .nm{font-weight:700;font-size:14.5px;line-height:1.25;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .un{font-size:12px;color:var(--muted);margin-top:-4px}
.pc .bt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.price{color:var(--acc);font-weight:800;font-size:15px}
.plus{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:500;flex:none}
.step{display:flex;align-items:center;background:var(--acc-s);border-radius:999px;padding:3px}
.step button{width:34px;height:34px;border-radius:50%;background:#fff;font-size:20px;font-weight:600;display:grid;place-items:center}
.step button.p{background:var(--acc);color:#fff}
.step .v{min-width:34px;text-align:center;font-weight:800;font-size:16px;padding:0 2px}
.step.big button{width:44px;height:44px;font-size:24px}.step.big .v{min-width:46px;font-size:20px}
.banner{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:6px;box-shadow:var(--sh)}
.banner .ic{width:50px;height:50px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:24px;flex:none}
.banner b{display:block;font-size:16px}.banner small{color:#bdb5aa;font-size:13px}
.btn{height:52px;border-radius:999px;padding:0 22px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;white-space:nowrap}
.btn.acc{background:var(--acc);color:#fff}.btn.light{background:var(--card);color:var(--ink);box-shadow:var(--sh)}.btn.ghost{background:var(--acc-s);color:var(--acc-d)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{height:40px;padding:0 16px;font-size:14px}.btn.w{width:100%}
.btn:disabled{opacity:.45}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(560px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(23,20,15,.25);z-index:30}
.cartbar .n{background:var(--acc);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);background:var(--card);border-radius:999px;padding:7px;display:flex;gap:6px;box-shadow:0 10px 30px rgba(23,20,15,.12);z-index:31}
.nav button{height:54px;min-width:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:700;font-size:14px;padding:0 16px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{background:var(--acc);color:#fff}
.nav button .bdg{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.nav button.on .bdg{background:var(--ink)}
@media(max-width:560px){.nav button .lbl{display:none}.nav button.on .lbl{display:inline}.nav{max-width:calc(100% - 16px);gap:2px}.nav button{min-width:46px;padding:0 11px}}
.card{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh)}
.list{display:flex;flex-direction:column;gap:10px}
.oc{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.oc .ic{width:52px;height:52px;border-radius:16px;background:var(--acc-s);display:grid;place-items:center;font-size:24px;flex:none}
.oc .t{font-weight:800;font-size:16px}.oc .s{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--acc-s);color:var(--acc-d)}.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.dark{background:var(--ink);color:#fff}
.lr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.lr .nm{font-weight:700;font-size:15px;line-height:1.25}.lr .un{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs button{height:40px;padding:0 16px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;color:var(--muted);box-shadow:var(--sh);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.back{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back h1{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back .sp{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-weight:600;font-size:12.5px}.kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:12px;background:var(--line);border-radius:999px;overflow:hidden}.bar .fl{height:100%;background:var(--acc);border-radius:999px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.cols .cl{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .cl i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:8px 8px 4px 4px;min-height:2px}
.cols .cl span{font-size:11px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>*{min-width:0}.lr .sp{min-width:0}.lr>.pill{flex-shrink:0}
@media(max-width:820px){.two{grid-template-columns:1fr}}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(23,20,15,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--bg);width:min(640px,100%);max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:su .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px;max-height:88dvh}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#d6d0c6;margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.5}}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.sw{width:52px;height:32px;border-radius:999px;background:#d9d3c9;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--bad)}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:su .2s;max-width:calc(100% - 32px);text-align:center}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e{font-size:46px;margin-bottom:10px}
/* setup */
.setup{max-width:520px;margin:6vh auto 0;text-align:center}
.logo{width:76px;height:76px;border-radius:24px;background:var(--acc);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 12px 26px rgba(242,140,40,.35)}
.logo svg{width:42px;height:42px}
.modes{display:grid;gap:12px;margin-top:22px;text-align:left}
.mode{background:var(--card);border-radius:var(--r-l);padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);width:100%}
.mode .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:var(--acc-s);flex:none}
.mode b{display:block;font-size:17px}.mode small{color:var(--muted);font-size:13px}
.pin{display:flex;justify-content:center;gap:12px;margin:22px 0}
.pin i{width:16px;height:16px;border-radius:50%;background:#d9d3c9}.pin i.on{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:76px;border-radius:50%;background:var(--card);font-size:26px;font-weight:700;box-shadow:var(--sh)}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.langs button{height:40px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;box-shadow:var(--sh)}
.langs button.on{background:var(--ink);color:#fff}
/* scanner */
.scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.scan #reader{flex:1;width:100%;overflow:hidden;position:relative}
.scan #reader video{object-fit:cover !important;width:100% !important;height:100% !important}
.scan .frame{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(78vw,340px);height:190px;border-radius:26px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:3px solid #fff;pointer-events:none;z-index:2}
.scan .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.scan .hd{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;align-items:center;gap:12px;z-index:3;color:#fff}
.scan .hd .icbtn{background:#fff;color:var(--ink)}
.scan .ft{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:3;display:flex;flex-direction:column;gap:10px}
.scan .last{background:rgba(255,255,255,.95);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.scan .man{display:flex;gap:8px}.scan .man input{flex:1;border-radius:999px;border:0;padding:0 18px;height:50px;font-size:16px}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:.2s}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);width:min(640px,calc(100% - 32px));display:flex;gap:10px;z-index:30}
.sticky .btn{flex:1;height:58px;font-size:17px;box-shadow:0 10px 26px rgba(23,20,15,.2)}
.lnstate{width:10px;align-self:stretch;border-radius:9px;flex:none;background:var(--line)}
.lnstate.ok{background:var(--ok)}.lnstate.part{background:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.r{text-align:right}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh);gap:2px;flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--acc);color:#fff}
.ok-anim{width:92px;height:92px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:10px auto 16px;color:#fff;font-size:46px;box-shadow:0 12px 30px rgba(47,158,91,.35)}
.net{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 10px);background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.net.off{background:var(--bad)}
.pc .im,.em{overflow:hidden}
.im img,.em img{width:100%;height:100%;object-fit:cover;display:block}
.pc .im .hab{z-index:1}
.remind{position:fixed;inset:0;z-index:70;background:rgba(23,20,15,.55);display:grid;place-items:center;padding:20px;animation:fi .2s}
.remind .box{background:var(--bg);border-radius:32px;padding:28px 22px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.remind .bell{width:96px;height:96px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:46px;margin:0 auto 16px;animation:ring 1.4s infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.pill.loc{background:#E8EEFC;color:#2F5BD3}
.photo-pick{height:160px;border-radius:20px;display:grid;place-items:center;overflow:hidden;margin-bottom:12px;cursor:pointer}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.testb{position:fixed;left:16px;top:calc(env(safe-area-inset-top) + 10px);background:var(--acc);color:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12.5px;z-index:60;box-shadow:0 8px 20px rgba(242,140,40,.35);letter-spacing:.03em;pointer-events:none}
body.testing #app{padding-top:calc(env(safe-area-inset-top) + 58px)}
.ktbl td,.ktbl th{white-space:nowrap}
.scrollx{overflow-x:auto;margin:0 -16px;padding:0 16px}

/* ===== Thème pro ===== */
.tbl th.r{text-align:right}
.mode{text-align:left}.mode>div{text-align:left}
.oc .plus{background:transparent!important;color:#9AA2AE!important;width:24px;font-size:24px}
.price{white-space:nowrap}
.pc .bt{flex-wrap:wrap;row-gap:6px}
@media(max-width:560px){.step.big button{width:38px;height:38px;font-size:20px}.step.big .v{min-width:36px;font-size:18px}}
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#15181C; --muted:#677080; --line:#E2E5E9; --soft:#EEF0F3;
  --acc:#E35D0B; --acc-d:#B84A06; --acc-s:#FFF1E6; --ok:#1C8248; --ok-s:#E6F4EC; --bad:#C42B2B; --bad-s:#FBEAEA; --blue:#2458C6; --blue-s:#E9EFFC;
  --r-xl:16px; --r-l:12px; --r-m:10px; --sh:0 0 0 1px var(--line);
  --t-surg:var(--soft); --t-frais:var(--soft); --t-epic:var(--soft); --t-sauc:var(--soft); --t-bois:var(--soft); --t-four:var(--soft); --t-entr:var(--soft);
}

  try{await loadBase()}catch(e){return mount(h("div",{class:"empty"},h("div",{class:"e"},"📡"),t("no_conn"),h("br"),h("button",{class:"btn acc",style:"margin-top:16px",onclick:()=>location.reload()},t("retry"))))}
  start();netBadge();flush();
})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
